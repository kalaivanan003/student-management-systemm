<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <h1>🎓 Student Management System</h1>
  </header>

  <div id="notification" class="notification hidden"></div>

  <main class="container">
    <!-- Dashboard -->
    <section class="cards">
      <div class="card stat"><span>Total Students</span><strong id="statTotal">0</strong></div>
      <div class="card stat"><span>Male Students</span><strong id="statMale">0</strong></div>
      <div class="card stat"><span>Female Students</span><strong id="statFemale">0</strong></div>
      <div class="card stat"><span>Courses</span><strong id="statCourses">0</strong></div>
    </section>

    <!-- Form -->
    <section class="card">
      <h2 id="formTitle">Add New Student</h2>
      <form id="studentForm" novalidate>
        <input type="hidden" id="studentId" />
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" placeholder="e.g. Arjun Kumar" />
            <small class="error-text" id="nameError"></small>
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" placeholder="e.g. arjun@example.com" />
            <small class="error-text" id="emailError"></small>
          </div>
          <div class="form-group">
            <label for="phone">Phone *</label>
            <input type="text" id="phone" maxlength="10" placeholder="10-digit mobile number" />
            <small class="error-text" id="phoneError"></small>
          </div>
          <div class="form-group">
            <label for="age">Age *</label>
            <input type="number" id="age" placeholder="16 - 100" />
            <small class="error-text" id="ageError"></small>
          </div>
          <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender">
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <small class="error-text" id="genderError"></small>
          </div>
          <div class="form-group">
            <label for="course">Course *</label>
            <input type="text" id="course" placeholder="e.g. Python Full Stack" />
            <small class="error-text" id="courseError"></small>
          </div>
          <div class="form-group full-width">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Optional" />
            <small class="error-text" id="addressError"></small>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Add Student</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- Table -->
    <section class="card">
      <div class="table-header">
        <h2>Student List</h2>
        <input type="text" id="searchInput" class="search-box"
               placeholder="Search by name, email, course or phone..." />
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Age</th>
              <th>Gender</th><th>Course</th><th>Address</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
